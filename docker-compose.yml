services:
  db:
    image: mysql:8.0
    container_name: devspace-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-12344321}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-developer_console}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-12344321}
    volumes:
      - devspace-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - devspace-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devspace-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-developer_console}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-12344321}
      JWT_SECRET: ${JWT_SECRET:-/Be/2qiFeoXEnY3i9eFPfDqOEQ9kMsM9ezU/x8ZQz9k=}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-900}
      DEMO_USERNAME: ${DEMO_USERNAME:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-change-me}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - devspace-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: devspace-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - devspace-network

volumes:
  devspace-db-data:

networks:
  devspace-network:
    driver: bridge
